<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Maison YoRa Review Approval</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f3eb;color:#2b2620;margin:0;padding:32px}.wrap{max-width:980px;margin:auto}.card{background:white;border:1px solid #ddd4c5;padding:22px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,textarea,button{font:inherit;padding:11px;border:1px solid #cfc5b5}input{min-width:280px}button{cursor:pointer;background:#2b2620;color:white}.secondary{background:white;color:#2b2620}.danger{background:#7f3f37}.muted{color:#756d62;font-size:13px}.stars{color:#9a7b45}.status{margin:12px 0}.review{white-space:pre-wrap;line-height:1.5}.code{font-weight:bold;letter-spacing:1px}
</style></head><body><div class="wrap"><h1>Maison YoRa Review Approval</h1><p class="muted">Private admin page. Enter the Netlify REVIEW_ADMIN_KEY to load pending reviews.</p>
<div class="card"><div class="row"><input id="key" type="password" placeholder="Admin key"><button id="load">Load pending reviews</button></div><p id="status" class="status muted"></p></div><div id="reviews"></div></div>
<script>
(function(){
const key=document.getElementById('key'), status=document.getElementById('status'), box=document.getElementById('reviews');
key.value=sessionStorage.getItem('yoraReviewAdminKey')||'';
async function call(action,extra={}){const k=key.value.trim(); if(!k) throw new Error('Enter the admin key.'); sessionStorage.setItem('yoraReviewAdminKey',k); const r=await fetch('/.netlify/functions/review-admin',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':k},body:JSON.stringify({action,...extra})}); const d=await r.json(); if(!r.ok) throw new Error(d.error||'Request failed.'); return d;}
function stars(n){return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){status.textContent='Loading…';box.innerHTML='';try{const d=await call('list');status.textContent=d.reviews.length?d.reviews.length+' pending review(s).':'No pending reviews.';d.reviews.forEach(r=>{const el=document.createElement('div');el.className='card';el.innerHTML=`<div class="stars">${stars(Number(r.rating)||0)}</div><h3>${esc(r.name)}</h3><div class="muted">${esc(r.submitted_at)} · ${esc(r.reward_status)}</div><p class="review">${esc(r.review)}</p><textarea placeholder="Optional admin note" rows="2" style="width:100%;box-sizing:border-box"></textarea><div class="row" style="margin-top:10px"><button data-a="approve">Approve + issue reward if eligible</button><button class="danger" data-a="reject">Reject</button></div><p class="muted result"></p>`;el.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const result=el.querySelector('.result');const note=el.querySelector('textarea').value;b.disabled=true;result.textContent='Working…';try{const out=await call(b.dataset.a,{review_id:r.review_id,note});result.innerHTML=esc(out.message)+(out.promo_code?`<br>Code: <span class="code">${esc(out.promo_code)}</span>`:'')+(out.email_sent?' · email sent':'');setTimeout(load,800)}catch(e){result.textContent=e.message;b.disabled=false;}});box.appendChild(el)});}catch(e){status.textContent=e.message;}}
document.getElementById('load').onclick=load;
})();
</script></body></html>
