<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Maison YoRa Review Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f3eb;color:#2b2620;margin:0;padding:32px}.wrap{max-width:1050px;margin:auto}.card{background:white;border:1px solid #ddd4c5;padding:22px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,textarea,button{font:inherit;padding:11px;border:1px solid #cfc5b5}input{min-width:280px}button{cursor:pointer;background:#2b2620;color:white}.secondary{background:white;color:#2b2620}.danger{background:#7f3f37}.test{background:#8a6b2f}.muted{color:#756d62;font-size:13px}.stars{color:#9a7b45}.status{margin:12px 0}.review{white-space:pre-wrap;line-height:1.5}.code{font-weight:bold;letter-spacing:1px}.pill{display:inline-block;border:1px solid #d8cebf;border-radius:999px;padding:4px 8px;font-size:12px;margin-left:8px}.pill.approved{background:#edf5ec}.pill.pending{background:#fbf4dc}.pill.rejected{background:#faecea}.pill.test{background:#eee9df}.help{line-height:1.5;max-width:850px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Maison YoRa Review Admin</h1>
  <p class="muted help">Private moderation page. Pending reviews can be approved, rejected, marked as Test, or deleted. Test reviews are never published and never receive a coupon. Use “All reviews” to remove an already approved, rejected, or test review.</p>
  <div class="card">
    <div class="row">
      <input id="key" type="password" placeholder="Admin key">
      <button id="loadPending">Pending reviews</button>
      <button id="loadAll" class="secondary">All reviews</button>
    </div>
    <p id="status" class="status muted"></p>
  </div>
  <div id="reviews"></div>
</div>
<script>
(function(){
  const key=document.getElementById('key');
  const status=document.getElementById('status');
  const box=document.getElementById('reviews');
  let currentMode='list';
  key.value=sessionStorage.getItem('yoraReviewAdminKey')||'';

  async function call(action,extra={}){
    const k=key.value.trim();
    if(!k) throw new Error('Enter the admin key.');
    sessionStorage.setItem('yoraReviewAdminKey',k);
    const r=await fetch('/.netlify/functions/review-admin',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Admin-Key':k},
      body:JSON.stringify({action,...extra})
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Request failed.');
    return d;
  }

  function stars(n){n=Math.max(0,Math.min(5,Number(n)||0));return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n)}
  function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function statusClass(s){s=String(s||'').toLowerCase();return ['approved','pending','rejected','test'].includes(s)?s:''}

  function actionButtons(r){
    const st=String(r.status||'').toLowerCase();
    if(st==='pending'){
      return '<button data-a="approve">Approve + issue reward if eligible</button>'+
        '<button class="danger" data-a="reject">Reject</button>'+
        '<button class="test" data-a="test">Mark as Test</button>'+
        '<button class="secondary" data-a="delete">Delete</button>';
    }
    return '<button class="secondary" data-a="delete">Delete review</button>';
  }

  async function runAction(button,r,el){
    const action=button.dataset.a;
    const result=el.querySelector('.result');
    const note=el.querySelector('textarea').value;
    if(action==='delete'){
      const msg='Delete this review permanently? If it has an associated Stripe review promotion code, the site will deactivate that code first.';
      if(!window.confirm(msg)) return;
    }
    button.disabled=true;
    result.textContent='Working…';
    try{
      const out=await call(action,{review_id:r.review_id,note});
      result.innerHTML=esc(out.message)+(out.promo_code?'<br>Code: <span class="code">'+esc(out.promo_code)+'</span>':'')+(out.email_sent?' · email sent':'');
      setTimeout(()=>load(currentMode),700);
    }catch(e){
      result.textContent=e.message;
      button.disabled=false;
    }
  }

  function renderReview(r){
    const el=document.createElement('div');
    el.className='card';
    const st=String(r.status||'Pending');
    el.innerHTML='<div class="stars">'+stars(r.rating)+'</div>'+
      '<h3>'+esc(r.name)+' <span class="pill '+statusClass(st)+'">'+esc(st)+'</span></h3>'+
      '<div class="muted">'+esc(r.submitted_at)+' · Reward: '+esc(r.reward_status||'—')+'</div>'+
      '<p class="review">'+esc(r.review)+'</p>'+
      '<textarea placeholder="Optional admin note" rows="2" style="width:100%;box-sizing:border-box"></textarea>'+
      '<div class="row" style="margin-top:10px">'+actionButtons(r)+'</div>'+
      '<p class="muted result"></p>';
    el.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>runAction(b,r,el));
    return el;
  }

  async function load(mode){
    currentMode=mode;
    status.textContent='Loading…';
    box.innerHTML='';
    try{
      const d=await call(mode);
      const reviews=Array.isArray(d.reviews)?d.reviews:[];
      status.textContent=reviews.length ? reviews.length+(mode==='list'?' pending':' total')+' review(s).' : (mode==='list'?'No pending reviews.':'No reviews found.');
      reviews.forEach(r=>box.appendChild(renderReview(r)));
    }catch(e){status.textContent=e.message;}
  }

  document.getElementById('loadPending').onclick=()=>load('list');
  document.getElementById('loadAll').onclick=()=>load('list_all');
})();
</script>
</body>
</html>
